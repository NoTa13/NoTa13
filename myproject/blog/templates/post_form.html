{% extends 'base.html' %}

{% block content %}
<h1>{% if post %}Редактировать{% else %}Создать{% endif %} пост</h1>
<form method="post">
    {% csrf_token %}
    
    <button type="submit" class="btn btn-success">{% if post %}Сохранить{% else %}Создать{% endif %}</button>
    <a href="{% url 'post_list' %}" class="btn btn-secondary">Отмена</a>
{{ form.title }}
{{ form.content }}
{% load form_tags %}
</form>
{% endblock %}
