{% extends 'base.html' %}

{% block content %}
  <h2>Вы уверены, что хотите удалить "{{ post.title }}"?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
